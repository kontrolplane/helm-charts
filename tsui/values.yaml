# default values for tsui.
#
# tsui is interactive, so the pod does not run it: the container idles and a
# session is started with `kubectl exec -it deploy/<release> -- tsui`. there is
# no port, service or ingress.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/kontrolplane/tsui
  pullPolicy: IfNotPresent
  # -- overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []

# -- how tsui connects to nats, passed as the environment variables it reads
nats:
  # -- nats server urls, comma separated (NATS_URL)
  url: nats://nats:4222
  # -- jetstream domain (NATS_JS_DOMAIN)
  jsDomain: ""
  # -- existing secret loaded with envFrom, for any of NATS_USER,
  # NATS_PASSWORD and NATS_TOKEN
  existingSecret: ""
  # -- existing secret holding a user credentials file, mounted read-only and
  # passed as NATS_CREDS
  credentials:
    existingSecret: ""
    key: nats.creds

podAnnotations: {}
podLabels: {}

# -- the image runs as 10001 and tsui writes nothing to disk
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #   memory: 128Mi
  # requests:
  #   cpu: 10m
  #   memory: 32Mi

# -- additional environment variables, e.g. NATS_CA for a private ca
extraEnv: []
# - name: NATS_CA
#   value: /etc/tsui/tls/ca.crt

# -- additional environment variables from secrets or configmaps
extraEnvFrom: []

# -- additional volumes
volumes: []

# -- additional volume mounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
