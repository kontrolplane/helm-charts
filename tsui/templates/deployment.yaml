apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tsui.fullname" . }}
  labels:
    {{- include "tsui.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tsui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tsui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # tsui only talks to nats, never to the kubernetes api
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # idle until someone execs in; the trap lets the pod stop without
          # waiting out the grace period.
          command: ["/bin/sh", "-c", "trap : TERM INT; sleep infinity & wait"]
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- with .Values.nats.jsDomain }}
            - name: NATS_JS_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.nats.credentials.existingSecret }}
            - name: NATS_CREDS
              value: /etc/tsui/credentials/{{ .Values.nats.credentials.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.nats.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- with .Values.nats.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.nats.credentials.existingSecret .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.nats.credentials.existingSecret }}
            - name: credentials
              mountPath: /etc/tsui/credentials
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.nats.credentials.existingSecret .Values.volumes }}
      volumes:
        {{- with .Values.nats.credentials.existingSecret }}
        - name: credentials
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: {{ $.Values.nats.credentials.key }}
                path: {{ $.Values.nats.credentials.key }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
