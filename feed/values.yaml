# default values for feed.
replicaCount: 1

image:
  repository: "ghcr.io/kontrolplane/feed"
  pullPolicy: IfNotPresent
  # overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- application configuration
config:
  # -- feed refresh interval (e.g. 15m, 1h)
  refreshInterval: "15m"
  # -- when items become read: "scroll", "open", or "manual"
  markReadOn: "open"
  # -- keep read items for: "7d", "30d", "90d", or "forever"
  retention: "30d"
  # -- list row density: "tight", "default", or "loose"
  density: "default"
  # -- enable debug logging
  debug: false
  # -- seed default feeds on startup
  seed: false

# -- feeds to import on startup (OPML format rendered from this list)
# when set, the default seed feeds are skipped unless config.seed is true
feeds: []
# - folder: default
#   feeds:
#     - title: hacker news
#       url: https://news.ycombinator.com/rss
#     - title: cncf
#       url: https://www.cncf.io/feed

# -- database configuration
database:
  # -- database driver: "sqlite" or "postgres"
  driver: sqlite

  # -- sqlite configuration (only used when driver is "sqlite")
  sqlite:
    # -- path inside the container for the sqlite database file
    path: /data/feed.db
    # -- persistence for sqlite data
    persistence:
      enabled: true
      # -- storage class for the pvc (empty string uses the default)
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi

  # -- postgresql configuration (only used when driver is "postgres")
  postgres:
    host: ""
    port: "5432"
    database: feed
    user: feed
    password: ""
    sslMode: disable
    # -- use an existing secret for database credentials
    # the secret must contain the keys: DATABASE_HOST, DATABASE_PORT,
    # DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD, DATABASE_SSL_MODE
    existingSecret: ""

# -- cloudnativepg cluster configuration
# requires the cnpg operator to be installed in the cluster
cnpg:
  enabled: false
  # -- name override for the cnpg cluster (defaults to fullname-db)
  nameOverride: ""
  # -- number of postgresql instances
  instances: 1
  # -- postgresql version image
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17"
  # -- database name to create
  database: feed
  # -- database owner
  owner: feed
  storage:
    size: 5Gi
    storageClass: ""
  resources: {}
    # requests:
    #   memory: 256Mi
    #   cpu: 100m
    # limits:
    #   memory: 512Mi
  # -- backup configuration
  backup:
    enabled: false
    # -- retention policy
    retentionPolicy: "30d"
    # -- schedule in cron format
    schedule: "0 0 * * *"
    # -- barman object store configuration
    barmanObjectStore: {}
      # destinationPath: s3://backups/feed
      # s3Credentials:
      #   accessKeyId:
      #     name: backup-creds
      #     key: ACCESS_KEY_ID
      #   secretAccessKey:
      #     name: backup-creds
      #     key: SECRET_ACCESS_KEY

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: feed.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: feed-tls
  #    hosts:
  #      - feed.example.com

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - feed.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# -- additional volumes
volumes: []

# -- additional volume mounts
volumeMounts: []

# -- additional environment variables
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- additional environment variables from secrets or configmaps
extraEnvFrom: []
# - secretRef:
#     name: my-secret

nodeSelector: {}

tolerations: []

affinity: {}
