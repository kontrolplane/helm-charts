apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "konfig.fullname" . }}-test-connection"
  labels:
    {{- include "konfig.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox
      command:
        - sh
        - -c
        - |
          set -e
          wget -q -O- "http://{{ include "konfig.componentName" (dict "ctx" . "component" "controlplane") }}:{{ .Values.controlplane.service.port }}/health"
          {{- if .Values.console.enabled }}
          wget -q -O- "http://{{ include "konfig.componentName" (dict "ctx" . "component" "console") }}:{{ .Values.console.service.port }}/healthz"
          {{- end }}
