{{- if and .Values.nats.enabled (not .Values.messagebus.auth.existingSecret) }}
{{- /*
the name here is a literal from values rather than one derived from the release:
the nats subchart names the same secret under `nats.container.env`, and helm
cannot template a subchart's values.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.messagebus.auth.secretName }}
  labels:
    {{- include "konfig.labels" (dict "ctx" . "component" "messagebus") | nindent 4 }}
type: Opaque
stringData:
  controlplane-password: {{ .Values.messagebus.auth.controlplanePassword | quote }}
  agent-password: {{ .Values.messagebus.auth.agentPassword | quote }}
{{- end }}
