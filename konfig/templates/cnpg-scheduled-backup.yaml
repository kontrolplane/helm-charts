{{- if and .Values.cnpg.enabled .Values.cnpg.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "konfig.cnpg.name" . }}-backup
  labels:
    {{- include "konfig.labels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  schedule: {{ .Values.cnpg.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "konfig.cnpg.name" . }}
{{- end }}
