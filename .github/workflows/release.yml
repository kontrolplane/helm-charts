name: release charts

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  changes:
    name: detect-changed-charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: find-changed-charts
        id: changed
        run: |
          # a chart is released when its current version has no tag yet. one
          # that has a tag but changed since is an error: the version was not
          # bumped, and merging it would publish nothing.
          charts=""
          failed=0

          for chart in $(find . -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \; | sed 's|^\./||' | sort); do
            version=$(yq '.version' "$chart/Chart.yaml")
            tag="${chart}-${version}"

            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              charts="$charts $chart"
            elif ! git diff --quiet "$tag" HEAD -- "$chart"; then
              echo "::error file=$chart/Chart.yaml::chart '$chart' changed since $tag was released. bump the version in $chart/Chart.yaml before merging."
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          json=$(echo "$charts" | jq -R -c 'split(" ") | map(select(length > 0))')
          echo "charts=$json" >> "$GITHUB_OUTPUT"

      - name: print-changes
        run: echo "changed charts - ${{ steps.changed.outputs.charts }}"

  release:
    name: release-charts
    needs: changes
    if: needs.changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure-git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: install-helm
        uses: azure/setup-helm@v5

      - name: package-charts
        run: |
          mkdir -p .cr-release-packages

          for chart in $(echo '${{ needs.changes.outputs.charts }}' | jq -r '.[]'); do
            version=$(yq '.version' "$chart/Chart.yaml")
            echo "==> packaging $chart $version"

            # `helm dependency build` resolves subcharts from Chart.lock, but
            # only from repositories helm already knows about.
            for repo in $(yq '.dependencies[].repository' "$chart/Chart.yaml" | grep -E '^https?://'); do
              helm repo add "$(echo "$repo" | sha256sum | cut -c1-12)" "$repo"
            done
            if [ "$(yq '.dependencies | length' "$chart/Chart.yaml")" -gt 0 ]; then
              helm dependency build "$chart"
            fi

            helm package "$chart" -d .cr-release-packages

            # pushed once the chart is published, so a failed publish can be
            # re-run instead of being blocked by its own tag.
            git tag "${chart}-${version}"
          done

      - name: login-to-ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: push-to-oci-registry
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            [ -f "$pkg" ] || continue
            echo "==> pushing $pkg to oci"
            helm push "$pkg" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
          done

      - name: checkout-gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: initialise-gh-pages-if-needed
        run: |
          if [ ! -d "gh-pages/.git" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: update-helm-repo-index
        run: |
          cp .cr-release-packages/*.tgz gh-pages/ 2>/dev/null || true

          if [ -f gh-pages/index.yaml ]; then
            helm repo index gh-pages \
              --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
              --merge gh-pages/index.yaml
          else
            helm repo index gh-pages \
              --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi

      - name: publish-gh-pages
        run: |
          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes to publish" && exit 0
          git commit -m "release $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:gh-pages --force

      - name: push-tags
        run: git push --tags
